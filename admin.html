<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #e11d48;
      --border-color: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h2, h3 {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 8px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #334155;
    }
    .btn-edit {
      background: #d97706;
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-delete {
      background: #dc2626;
      padding: 6px 12px;
      font-size: 12px;
    }
    
    /* Login Box Overlay */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .login-box {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 320px;
      text-align: center;
    }
    .lock-icon {
      width: 50px;
      height: 50px;
      background: rgba(225, 29, 72, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      border: 1px solid rgba(225, 29, 72, 0.3);
      color: var(--accent-color);
      font-size: 20px;
    }
    .btn-logout {
      background: #475569;
      float: right;
    }

    /* Badge & Item List Design */
    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-right: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .video-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
      gap: 12px;
    }
    .video-info-box {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .video-list-thumb {
      width: 50px;
      height: 35px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #1e293b;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="login-overlay">
    <div class="login-box">
      <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 style="border:none; margin-top:0; margin-bottom:5px;">Admin Access Required</h2>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">প্রবেশ করতে অ্যাডমিন পাসওয়ার্ড লিখুন</p>
      
      <div class="form-group">
        <input type="password" id="admin-pass-input" placeholder="Enter Admin Password" style="text-align:center;">
      </div>
      <button type="button" onclick="checkAdminPassword()" style="width: 100%;">Login to Dashboard</button>
      <p id="login-err" style="color: #ef4444; margin-top: 10px; font-size: 13px; display: none;">ভুল পাসওয়ার্ড!</p>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" class="container" style="display: none;">
    <div style="overflow: hidden; margin-bottom: 15px;">
      <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
      <h2>Admin Control Panel</h2>
    </div>

    <!-- Category Management -->
    <div class="card">
      <h3>১. ক্যাটাগরি ম্যানেজমেন্ট (Add, Rename & Delete)</h3>
      <div class="form-group">
        <input type="text" id="cat-name" placeholder="যেমন: Desi, Web Series, Foreign">
      </div>
      <button onclick="addCategory()">Save Category</button>
      
      <div id="category-list-container" style="margin-top: 15px;">
        <!-- Dynamic Categories badges will appear here -->
      </div>
    </div>

    <!-- Site Settings (Notice / Links) -->
    <div class="card">
      <h3>২. সাইট সেটিংস (Notice & Links)</h3>
      <div class="form-group">
        <label>Website Notice Banner:</label>
        <textarea id="setting-notice" rows="2" placeholder="সাইটের নোটিশ লিখুন..."></textarea>
      </div>
      <div class="form-group">
        <label>Telegram Channel Link:</label>
        <input type="text" id="setting-telegram" placeholder="https://t.me/yourchannel">
      </div>
      <div class="form-group">
        <label>Contact / Report Link:</label>
        <input type="text" id="setting-contact" placeholder="https://t.me/yourcontact">
      </div>
      <button onclick="saveSettings()">Save Settings</button>
    </div>

    <!-- Add / Edit Video Section -->
    <div class="card" id="video-form-card">
      <h3 id="video-form-title">৩. নতুন ভিডিও আপলোড / যোগ করুন</h3>
      <input type="hidden" id="vid-edit-id">

      <div class="form-group">
        <label>Video Title *:</label>
        <input type="text" id="vid-title" placeholder="ভিডিওর শিরোনাম">
      </div>
      <div class="form-group">
        <label>Category:</label>
        <select id="vid-category">
          <option value="">Select Category</option>
        </select>
      </div>
      <div class="form-group">
        <label>Embed Code / Player URL *:</label>
        <input type="text" id="vid-embed" placeholder="https://catbox.moe/c/xxx or iframe code">
      </div>
      <div class="form-group">
        <label>Thumbnail Image URL *:</label>
        <input type="text" id="vid-thumb" placeholder="https://i.ibb.co/xxx/image.jpg">
      </div>
      <div class="form-group">
        <label>Direct Download Link (Optional):</label>
        <input type="text" id="vid-download" placeholder="https://files.catbox.moe/xxx.mp4">
      </div>
      
      <div style="display: flex; gap: 10px;">
        <button id="vid-submit-btn" onclick="saveVideo()">Upload Video</button>
        <button id="vid-cancel-btn" onclick="resetVideoForm()" class="btn-secondary" style="display: none;">Cancel Edit</button>
      </div>
    </div>

    <!-- All Uploaded Videos (Manage List) -->
    <div class="card">
      <h3>৪. ভিডিও তালিকা ও ম্যানেজমেন্ট (Edit & Delete)</h3>
      <div id="video-list-container">
        <!-- Dynamic video list will appear here -->
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // ⚙️ CONFIGURATION & CREDENTIALS
    // ==========================================
    const SUPABASE_URL = "https://hvrgpkojcukptogznyjf.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cmdwa29qY3VrcHRvZ3pueWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTMzNjcsImV4cCI6MjEwMjYyOTM2N30.LqHd9lbBdOPVVYC9mo2_ogRP_6adYRT3XY7KbL7hlm0";
    const ADMIN_PASSWORD = "Hh907$$$"; // 👈 আপনার সিক্রেট পাসওয়ার্ড

    let supabaseClient = null;

    // --- Login Logic ---
    function checkAdminPassword() {
      const inputPass = document.getElementById('admin-pass-input').value;
      const errEl = document.getElementById('login-err');

      if (inputPass === ADMIN_PASSWORD) {
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        errEl.style.display = 'none';
        showDashboard();
      } else {
        errEl.style.display = 'block';
      }
    }

    function showDashboard() {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      
      // Init Supabase Client
      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      
      loadCategories();
      loadSettings();
      loadVideos();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('isAdminLoggedIn');
      location.reload();
    }

    // Auto Login Check
    if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
      showDashboard();
    }

    // --- Category Operations (Add, Rename, Delete) ---
    async function loadCategories() {
      if(!supabaseClient) return;
      const { data } = await supabaseClient.from('categories').select('*');
      
      const select = document.getElementById('vid-category');
      const catContainer = document.getElementById('category-list-container');
      
      select.innerHTML = '<option value="">Select Category</option>';
      catContainer.innerHTML = '';

      if (data) {
        data.forEach(cat => {
          select.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;

          const badge = document.createElement('div');
          badge.className = 'cat-badge';
          badge.innerHTML = `
            <span>${cat.name}</span>
            <i class="fa-solid fa-pen-to-square" style="color: #f59e0b; cursor: pointer; font-size: 12px;" onclick="renameCategory(${cat.id}, '${cat.name}')" title="Rename"></i>
            <i class="fa-solid fa-trash" style="color: #ef4444; cursor: pointer; font-size: 12px;" onclick="deleteCategory(${cat.id})" title="Delete"></i>
          `;
          catContainer.appendChild(badge);
        });
      }
    }

    async function addCategory() {
      const catName = document.getElementById('cat-name').value.trim();
      if (!catName) return alert('ক্যাটাগরির নাম দিন!');
      
      const { error } = await supabaseClient.from('categories').insert([{ name: catName }]);
      if (error) alert('Error: ' + error.message);
      else {
        alert('ক্যাটাগরি সেভ হয়েছে!');
        document.getElementById('cat-name').value = '';
        loadCategories();
      }
    }

    async function renameCategory(id, currentName) {
      const newName = prompt('ক্যাটাগরির নতুন নাম লিখুন:', currentName);
      if (newName && newName.trim() !== '' && newName.trim() !== currentName) {
        const { error } = await supabaseClient.from('categories').update({ name: newName.trim() }).eq('id', id);
        if (error) alert('Error: ' + error.message);
        else {
          alert('ক্যাটাগরির নাম পরিবর্তন করা হয়েছে!');
          loadCategories();
        }
      }
    }

    async function deleteCategory(id) {
      if (confirm('আপনি কি নিশ্চিত এই ক্যাটাগরি ডিলিট করতে চান?')) {
        const { error } = await supabaseClient.from('categories').delete().eq('id', id);
        if (error) alert('Error: ' + error.message);
        else loadCategories();
      }
    }

    // --- Site Settings Operations ---
    async function loadSettings() {
      if(!supabaseClient) return;
      const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle();
      if (data) {
        document.getElementById('setting-notice').value = data.notice || '';
        document.getElementById('setting-telegram').value = data.telegram_link || '';
        document.getElementById('setting-contact').value = data.contact_link || '';
      }
    }

    async function saveSettings() {
      const notice = document.getElementById('setting-notice').value.trim();
      const telegram = document.getElementById('setting-telegram').value.trim();
      const contact = document.getElementById('setting-contact').value.trim();

      const { error } = await supabaseClient.from('settings').upsert(
        { id: 1, notice: notice, telegram_link: telegram, contact_link: contact },
        { onConflict: 'id' }
      );

      if (error) alert('Error: ' + error.message);
      else alert('সেটিংস সফলভাবে আপডেট হয়েছে!');
    }

    // --- Video Management (Add, Edit, Update, Delete, List) ---
    async function saveVideo() {
      const editId = document.getElementById('vid-edit-id').value;
      const title = document.getElementById('vid-title').value.trim();
      const category = document.getElementById('vid-category').value;
      const embed = document.getElementById('vid-embed').value.trim();
      const thumb = document.getElementById('vid-thumb').value.trim();
      const download = document.getElementById('vid-download').value.trim();

      if (!title || !embed || !thumb) return alert('টাইটেল, প্লেয়ার লিংক এবং থাম্বনেইল দেওয়া বাধ্যতামূলক!');

      const payload = {
        title: title,
        category: category,
        embed_code: embed,
        thumbnail_url: thumb,
        download_link: download
      };

      if (editId) {
        // Update Video
        const { error } = await supabaseClient.from('videos').update(payload).eq('id', editId);
        if (error) alert('Error: ' + error.message);
        else alert('ভিডিও আপডেট করা হয়েছে!');
      } else {
        // Add New Video
        const { error } = await supabaseClient.from('videos').insert([payload]);
        if (error) alert('Error: ' + error.message);
        else alert('ভিডিও আপলোড করা হয়েছে!');
      }

      resetVideoForm();
      loadVideos();
    }

    async function loadVideos() {
      if(!supabaseClient) return;
      const { data } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
      const container = document.getElementById('video-list-container');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color: #64748b; font-style: italic;">কোন ভিডিও পাওয়া যায়নি।</p>';
        return;
      }

      data.forEach(vid => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `
          <div class="video-info-box">
            <img src="${vid.thumbnail_url || 'https://via.placeholder.com/50x35'}" class="video-list-thumb" alt="Thumb">
            <div>
              <div style="font-weight: bold; font-size: 14px;">${vid.title}</div>
              <div style="font-size: 11px; color: #94a3b8;">ক্যাটাগরি: ${vid.category || 'None'}</div>
            </div>
          </div>
          <div style="display: flex; gap: 6px; flex-shrink: 0;">
            <button class="btn-edit" onclick='startEditVideo(${JSON.stringify(vid).replace(/'/g, "&apos;")})'>Edit</button>
            <button class="btn-delete" onclick="deleteVideo(${vid.id})">Delete</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function startEditVideo(vid) {
      document.getElementById('vid-edit-id').value = vid.id;
      document.getElementById('vid-title').value = vid.title;
      document.getElementById('vid-category').value = vid.category || '';
      document.getElementById('vid-embed').value = vid.embed_code;
      document.getElementById('vid-thumb').value = vid.thumbnail_url || '';
      document.getElementById('vid-download').value = vid.download_link || '';

      document.getElementById('video-form-title').innerText = '৩. ভিডিও এডিট করুন';
      document.getElementById('vid-submit-btn').innerText = 'Update Video';
      document.getElementById('vid-cancel-btn').style.display = 'inline-block';

      // Scroll smoothly to form
      document.getElementById('video-form-card').scrollIntoView({ behavior: 'smooth' });
    }

    function resetVideoForm() {
      document.getElementById('vid-edit-id').value = '';
      document.getElementById('vid-title').value = '';
      document.getElementById('vid-category').value = '';
      document.getElementById('vid-embed').value = '';
      document.getElementById('vid-thumb').value = '';
      document.getElementById('vid-download').value = '';

      document.getElementById('video-form-title').innerText = '৩. নতুন ভিডিও আপলোড / যোগ করুন';
      document.getElementById('vid-submit-btn').innerText = 'Upload Video';
      document.getElementById('vid-cancel-btn').style.display = 'none';
    }

    async function deleteVideo(id) {
      if (confirm('আপনি কি নিশ্চিত এই ভিডিও ডিলিট করতে চান?')) {
        const { error } = await supabaseClient.from('videos').delete().eq('id', id);
        if (error) alert('Error: ' + error.message);
        else loadVideos();
      }
    }
  </script>
</body>
</html>
