<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #e11d48;
      --border-color: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h2, h3 {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 8px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    /* Login Overlay Style */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .login-box {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      width: 320px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    .btn-logout {
      background: #475569;
      float: right;
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>Admin Login</h2>
      <div class="form-group">
        <input type="password" id="admin-pass-input" placeholder="Enter Admin Password">
      </div>
      <button onclick="checkAdminPassword()">Login</button>
      <p id="login-err" style="color: #ef4444; margin-top: 10px; display: none;">ভুল পাসওয়ার্ড!</p>
    </div>
  </div>

  <!-- Admin Main Dashboard Content -->
  <div id="admin-dashboard" class="container hidden">
    <div style="overflow: hidden; margin-bottom: 15px;">
      <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
      <h2>Admin Control Panel</h2>
    </div>

    <!-- Category Management -->
    <div class="card">
      <h3>১. নতুন ক্যাটাগরি যুক্ত করুন</h3>
      <div class="form-group">
        <input type="text" id="cat-name" placeholder="যেমন: Desi, Web Series, Foreign">
      </div>
      <button onclick="addCategory()">Save Category</button>
    </div>

    <!-- Site Settings (Notice / Telegram) -->
    <div class="card">
      <h3>২. সাইট সেটিংস (Notice & Links)</h3>
      <div class="form-group">
        <label>Website Notice Banner:</label>
        <textarea id="setting-notice" rows="2" placeholder="সাইটের নোটিশ লিখুন..."></textarea>
      </div>
      <div class="form-group">
        <label>Telegram Channel Link:</label>
        <input type="text" id="setting-telegram" placeholder="https://t.me/yourchannel">
      </div>
      <div class="form-group">
        <label>Contact / Report Link:</label>
        <input type="text" id="setting-contact" placeholder="https://t.me/yourcontact">
      </div>
      <button onclick="saveSettings()">Save Settings</button>
    </div>

    <!-- Add Video -->
    <div class="card">
      <h3>৩. নতুন ভিডিও আপলোড / যোগ করুন</h3>
      <div class="form-group">
        <label>Video Title:</label>
        <input type="text" id="vid-title" placeholder="ভিডিওর শিরোনাম">
      </div>
      <div class="form-group">
        <label>Category:</label>
        <select id="vid-category">
          <option value="">Select Category</option>
        </select>
      </div>
      <div class="form-group">
        <label>Embed Code / Player URL (Catbox/Doodstream):</label>
        <input type="text" id="vid-embed" placeholder="https://catbox.moe/c/xxx or iframe code">
      </div>
      <div class="form-group">
        <label>Thumbnail Image URL:</label>
        <input type="text" id="vid-thumb" placeholder="https://i.ibb.co/xxx/image.jpg">
      </div>
      <div class="form-group">
        <label>Direct Download Link (Optional):</label>
        <input type="text" id="vid-download" placeholder="https://files.catbox.moe/xxx.mp4">
      </div>
      <button onclick="addVideo()">Upload Video</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ CONFIGURATION (আপনার তথ্যগুলো এখানে দিন)
    // ==========================================
    const SUPABASE_URL = "https://hvrgpkojcukptogznyjf.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cmdwa29qY3VrcHRvZ3pueWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTMzNjcsImV4cCI6MjEwMjYyOTM2N30.LqHd9lbBdOPVVYC9mo2_ogRP_6adYRT3XY7KbL7hlm0";
    const ADMIN_PASSWORD = "hasan907"; // 👈 আপনার পছন্দের সিক্রেট পাসওয়ার্ড এখানে দিন

    // Initialize Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Check Login Status on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
        showDashboard();
      }
    });

    // Login Check
    function checkAdminPassword() {
      const inputPass = document.getElementById('admin-pass-input').value;
      const errEl = document.getElementById('login-err');

      if (inputPass === ADMIN_PASSWORD) {
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        errEl.style.display = 'none';
        showDashboard();
      } else {
        errEl.style.display = 'block';
      }
    }

    function showDashboard() {
      document.getElementById('login-overlay').classList.add('hidden');
      document.getElementById('admin-dashboard').classList.remove('hidden');
      loadCategories();
      loadSettings();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('isAdminLoggedIn');
      location.reload();
    }

    // --- 1. Category Operations ---
    async function loadCategories() {
      const { data, error } = await supabase.from('categories').select('*');
      if (data) {
        const select = document.getElementById('vid-category');
        select.innerHTML = '<option value="">Select Category</option>';
        data.forEach(cat => {
          select.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
        });
      }
    }

    async function addCategory() {
      const catName = document.getElementById('cat-name').value.trim();
      if (!catName) return alert('ক্যাটাগরির নাম দিন!');
      
      const { error } = await supabase.from('categories').insert([{ name: catName }]);
      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('ক্যাটাগরি সেভ হয়েছে!');
        document.getElementById('cat-name').value = '';
        loadCategories();
      }
    }

    // --- 2. Site Settings Operations ---
    async function loadSettings() {
      const { data, error } = await supabase.from('settings').select('*').eq('id', 1).maybeSingle();
      if (data) {
        document.getElementById('setting-notice').value = data.notice || '';
        document.getElementById('setting-telegram').value = data.telegram_link || '';
        document.getElementById('setting-contact').value = data.contact_link || '';
      }
    }

    async function saveSettings() {
      const notice = document.getElementById('setting-notice').value.trim();
      const telegram = document.getElementById('setting-telegram').value.trim();
      const contact = document.getElementById('setting-contact').value.trim();

      // Fix for smooth insert/update
      const { error } = await supabase.from('settings').upsert(
        { id: 1, notice: notice, telegram_link: telegram, contact_link: contact },
        { onConflict: 'id' }
      );

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('সেটিংস সফলভাবে আপডেট হয়েছে!');
      }
    }

    // --- 3. Add Video Operations ---
    async function addVideo() {
      const title = document.getElementById('vid-title').value.trim();
      const category = document.getElementById('vid-category').value;
      const embed = document.getElementById('vid-embed').value.trim();
      const thumb = document.getElementById('vid-thumb').value.trim();
      const download = document.getElementById('vid-download').value.trim();

      if (!title || !embed || !thumb) {
        return alert('টাইটেল, প্লেয়ার লিংক এবং থাম্বনেইল দেওয়া বাধ্যতামূলক!');
      }

      const { error } = await supabase.from('videos').insert([{
        title: title,
        category: category,
        embed_code: embed,
        thumbnail_url: thumb,
        download_link: download
      }]);

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('ভিডিও সফলভাবে আপলোড করা হয়েছে!');
        document.getElementById('vid-title').value = '';
        document.getElementById('vid-embed').value = '';
        document.getElementById('vid-thumb').value = '';
        document.getElementById('vid-download').value = '';
      }
    }
  </script>
</body>
</html>
