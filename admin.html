<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiTube - Secure Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <!-- 1. Password Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex justify-center items-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/20">
                <i class="fa-solid fa-lock text-2xl text-red-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-1">Admin Access Required</h2>
            <p class="text-xs text-slate-400 mb-6">প্রবেশ করতে অ্যাডমিন পাসওয়ার্ড লিখুন</p>
            
            <div class="space-y-4">
                <input type="password" id="admin-pass-input" placeholder="Password" class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500 text-center font-mono">
                <button type="button" onclick="checkAdminPassword()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-red-600/20">Login to Dashboard</button>
                <p id="login-err" class="text-xs text-red-400 font-medium hidden">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>
            </div>
        </div>
    </div>

    <!-- 2. Main Admin Dashboard -->
    <div id="admin-dashboard" class="max-w-5xl mx-auto space-y-6 p-4 md:p-8 hidden">
        
        <!-- Header Section -->
        <div class="flex flex-wrap justify-between items-center bg-slate-900/60 p-5 rounded-2xl border border-slate-800 backdrop-blur-sm gap-4">
            <div>
                <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> DesiTube Control Panel
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">ওয়েবসাইটের কনটেন্ট ও সেটিংস পরিচালনা করুন</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="/" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-globe"></i> View Website
                </a>
                <button onclick="logoutAdmin()" class="bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-xs px-3 py-2 rounded-xl transition border border-slate-700">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>

        <!-- Site Settings Section -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
            <h2 class="text-md font-semibold mb-4 text-slate-200 flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-gear text-amber-500"></i> Site Settings (Notice & Social Links)
            </h2>
            <form id="settings-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Marquee Notice Text (খালি রাখলে সাইটে দেখাবে না)</label>
                    <input type="text" id="notice-input" placeholder="যেমন: নতুন সব ভিডিও দেখতে আমাদের সাথে থাকুন..." class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Telegram Channel Link</label>
                        <input type="url" id="telegram-input" placeholder="https://t.me/yourchannel" class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Contact Link (Telegram/WhatsApp/Email)</label>
                        <input type="text" id="contact-input" placeholder="https://t.me/yourusername" class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 px-6 rounded-xl text-xs transition shadow-lg shadow-amber-600/10">
                    Save Settings
                </button>
            </form>
        </div>

        <!-- Category Management Section -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
            <h2 class="text-md font-semibold mb-4 text-slate-200 flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-list text-blue-500"></i> Manage Categories
            </h2>
            <form id="category-form" class="flex gap-2 mb-4">
                <input type="text" id="cat-name-input" placeholder="যেমন: দেশী, Web Series, Foreign" class="flex-1 bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-blue-500" required>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-xl text-xs transition shadow-lg shadow-blue-600/10">
                    Add Category
                </button>
            </form>
            <div id="category-list" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Video Add / Edit Section -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
            <h2 id="form-title" class="text-md font-semibold mb-4 text-slate-200 flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-video text-emerald-500"></i> Add New Video
            </h2>
            <form id="video-form" class="space-y-4">
                <input type="hidden" id="edit-video-id">

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Video Title *</label>
                    <input type="text" id="video-title" placeholder="ভিডিওর নাম বা টাইটেল লিখুন..." class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Embed Video Link / URL * (Catbox / Streamtape / Doodstream / Iframe)</label>
                    <input type="text" id="video-embed" placeholder="https://catbox.moe/c/xxx or https://streamtape.com/e/..." class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Thumbnail Image Link (Optional)</label>
                        <input type="url" id="video-thumb" placeholder="https://i.ibb.co/xxx.jpg" class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Category (Optional)</label>
                        <select id="video-category" class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500 text-slate-300">
                            <option value="">None</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Download Button Link (Optional)</label>
                    <input type="text" id="video-download" placeholder="খালি রাখলে ভিডিওতে ডাউনলোড বাটন দেখাবে না" class="w-full bg-slate-950 text-sm rounded-xl p-3 border border-slate-800 focus:outline-none focus:border-red-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="save-btn" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-xl text-xs transition shadow-lg shadow-red-600/20">
                        Save Video
                    </button>
                    <button type="button" id="cancel-edit-btn" onclick="resetVideoForm()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 px-4 rounded-xl text-xs transition border border-slate-700">
                        Cancel Edit
                    </button>
                </div>
            </form>
        </div>

        <!-- All Videos List Section (Edit & Delete Available) -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
            <h2 class="text-md font-semibold mb-4 text-slate-200 flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-list-check text-red-500"></i> All Uploaded Videos
            </h2>
            <div id="video-list" class="space-y-3"></div>
        </div>

    </div>

    <!-- JavaScript Engine & Security Logic -->
    <script>
        // Configs
        const SUPABASE_URL = "https://hvrgpkojcukptogznyjf.supabase.co";[cite: 1]
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cmdwa29qY3VrcHRvZ3pueWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTMzNjcsImV4cCI6MjEwMjYyOTM2N30.LqHd9lbBdOPVVYC9mo2_ogRP_6adYRT3XY7KbL7hlm0";  [cite: 1]
        const ADMIN_PASSWORD = "Hh907$$$"; // 👈 আপনার পছন্দমতো পাসওয়ার্ড বসিয়ে নেবেন

        let supabaseClient = null;
        let categoriesList = [];

        // Auth Logic
        function checkAdminPassword() {
            const inputPass = document.getElementById('admin-pass-input').value;
            const errEl = document.getElementById('login-err');

            if (inputPass === ADMIN_PASSWORD) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                errEl.classList.add('hidden');
                initDashboard();
            } else {
                errEl.classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        function initDashboard() {
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');

            if (!supabaseClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);[cite: 1]
            }

            loadSettings();
            loadCategories();
            loadVideos();
        }

        // Auto Login Check
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            initDashboard();
        }

        // --- Settings Management ---
        async function loadSettings() {
            const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle();
            if (data) {
                document.getElementById('notice-input').value = data.notice || '';[cite: 1]
                document.getElementById('telegram-input').value = data.telegram_link || '';[cite: 1]
                document.getElementById('contact-input').value = data.contact_link || '';[cite: 1]
            }
        }

        document.getElementById('settings-form').onsubmit = async (e) => {
            e.preventDefault();
            const notice = document.getElementById('notice-input').value.trim();[cite: 1]
            const telegram_link = document.getElementById('telegram-input').value.trim();[cite: 1]
            const contact_link = document.getElementById('contact-input').value.trim();[cite: 1]

            const { error } = await supabaseClient.from('settings').upsert({ id: 1, notice, telegram_link, contact_link }, { onConflict: 'id' });[cite: 1]
            if (error) alert("Error saving settings: " + error.message);[cite: 1]
            else alert("Settings updated successfully!");[cite: 1]
        };

        // --- Category Management ---
        async function loadCategories() {
            const { data } = await supabaseClient.from('categories').select('*');[cite: 1]
            categoriesList = data || [];[cite: 1]
            
            const catSelect = document.getElementById('video-category');[cite: 1]
            catSelect.innerHTML = '<option value="">None</option>';[cite: 1]
            
            const catContainer = document.getElementById('category-list');[cite: 1]
            catContainer.innerHTML = '';[cite: 1]

            categoriesList.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;[cite: 1]
                opt.innerText = cat.name;[cite: 1]
                catSelect.appendChild(opt);[cite: 1]

                const badge = document.createElement('div');
                badge.className = "bg-slate-950 border border-slate-800 text-xs text-slate-300 px-3 py-1.5 rounded-xl flex items-center gap-2";[cite: 1]
                badge.innerHTML = `
                    <span>${cat.name}</span>
                    <button onclick="deleteCategory(${cat.id})" class="text-red-400 hover:text-red-500 transition ml-1"><i class="fa-solid fa-xmark"></i></button>
                `;[cite: 1]
                catContainer.appendChild(badge);[cite: 1]
            });
        }

        document.getElementById('category-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('cat-name-input').value.trim();[cite: 1]
            if(!name) return;
            await supabaseClient.from('categories').insert([{ name }]);[cite: 1]
            document.getElementById('cat-name-input').value = '';[cite: 1]
            loadCategories();[cite: 1]
        };

        async function deleteCategory(id) {
            if (confirm("Are you sure you want to delete this category?")) {[cite: 1]
                await supabaseClient.from('categories').delete().eq('id', id);[cite: 1]
                loadCategories();[cite: 1]
            }
        }

        // --- Video Add, Edit & Delete Management ---
        document.getElementById('video-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-video-id').value;[cite: 1]
            const title = document.getElementById('video-title').value.trim();[cite: 1]
            const embed_code = document.getElementById('video-embed').value.trim();[cite: 1]
            const thumbnail_url = document.getElementById('video-thumb').value.trim();[cite: 1]
            const category = document.getElementById('video-category').value;[cite: 1]
            const download_link = document.getElementById('video-download').value.trim();[cite: 1]

            const payload = { title, embed_code, thumbnail_url, category, download_link };[cite: 1]

            if (id) {
                const { error } = await supabaseClient.from('videos').update(payload).eq('id', id);[cite: 1]
                if (error) alert("Error: " + error.message);
                else alert("Video Updated Successfully!");[cite: 1]
            } else {
                const { error } = await supabaseClient.from('videos').insert([payload]);[cite: 1]
                if (error) alert("Error: " + error.message);
                else alert("Video Added Successfully!");[cite: 1]
            }

            resetVideoForm();[cite: 1]
            loadVideos();[cite: 1]
        };

        function editVideo(video) {
            document.getElementById('edit-video-id').value = video.id;[cite: 1]
            document.getElementById('video-title').value = video.title;[cite: 1]
            document.getElementById('video-embed').value = video.embed_code;[cite: 1]
            document.getElementById('video-thumb').value = video.thumbnail_url || '';[cite: 1]
            document.getElementById('video-category').value = video.category || '';[cite: 1]
            document.getElementById('video-download').value = video.download_link || '';[cite: 1]

            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-500"></i> Edit Video Details';[cite: 1]
            document.getElementById('save-btn').innerText = "Update Video";[cite: 1]
            document.getElementById('save-btn').className = "bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 px-6 rounded-xl text-xs transition shadow-lg shadow-amber-600/20";[cite: 1]
            document.getElementById('cancel-edit-btn').classList.remove('hidden');[cite: 1]
            
            window.scrollTo({ top: document.getElementById('video-form').offsetTop - 20, behavior: 'smooth' });
        }

        function resetVideoForm() {
            document.getElementById('video-form').reset();[cite: 1]
            document.getElementById('edit-video-id').value = '';[cite: 1]
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-video text-emerald-500"></i> Add New Video';[cite: 1]
            document.getElementById('save-btn').innerText = "Save Video";[cite: 1]
            document.getElementById('save-btn').className = "bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-xl text-xs transition shadow-lg shadow-red-600/20";[cite: 1]
            document.getElementById('cancel-edit-btn').classList.add('hidden');[cite: 1]
        }

        async function deleteVideo(id) {
            if (confirm("Are you sure you want to delete this video?")) {[cite: 1]
                await supabaseClient.from('videos').delete().eq('id', id);[cite: 1]
                loadVideos();[cite: 1]
            }
        }

        async function loadVideos() {
            const { data } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });[cite: 1]
            const list = document.getElementById('video-list');[cite: 1]
            list.innerHTML = '';[cite: 1]

            if (!data || data.length === 0) {
                list.innerHTML = '<p class="text-slate-500 text-xs italic">No videos found in database.</p>';[cite: 1]
                return;
            }

            data.forEach(v => {
                const item = document.createElement('div');
                item.className = "bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 flex justify-between items-center gap-4 hover:border-slate-700 transition";[cite: 1]
                item.innerHTML = `
                    <div class="flex-1 truncate">
                        <h4 class="font-semibold text-xs truncate text-slate-200">${v.title}</h4>
                        <span class="text-[10px] text-slate-500 font-mono">${v.category || 'No Category'}</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick='editVideo(${JSON.stringify(v).replace(/'/g, "&apos;")})' class="bg-amber-600/20 hover:bg-amber-600 text-amber-400 hover:text-white border border-amber-600/30 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-pen text-[10px]"></i> Edit
                        </button>
                        <button onclick="deleteVideo(${v.id})" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/30 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-trash text-[10px]"></i> Delete
                        </button>
                    </div>
                `;[cite: 1]
                list.appendChild(item);[cite: 1]
            });
        }
    </script>
</body>
</html>
